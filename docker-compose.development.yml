# The middleware this repository needs for manual verification, brought up by ./docker.sh.
#
# Everything the stack can offer is written here, and everything this version does not need
# sits behind a `profiles` entry rather than behind a comment: a commented-out service is not
# validated by `docker compose config`, and turning it on means editing the file. A profile is
# turned on with one line in `.env.development`.
#
# `expense-note`'s spec declares MariaDB alone (Manual verification, section 8), so MariaDB is
# the only service in the default profile. Redis sits behind a profile too, which the guide's
# example does not do — this version runs no background job, and the queue is the only thing
# that would need it.
#
# Every port is published on 127.0.0.1. Binding every interface would put a database whose
# password is `password` on whatever network this machine is attached to.
#
# WHY THIS CONTAINER EXISTS AT ALL, given that nothing in day-to-day development connects to
# it: sequelize/config.cjs runs `development` on SQLite, so the column types section 9 of the
# spec declares are never actually exercised by a development run or by the test suites.
# SQLite reads a `bigint` primary key back as `INTEGER` and every `datetime(3)` as a bare
# `DATETIME`, and it is lax about `varchar(191)`. A migration can therefore pass every local
# check and still be wrong. Run the migrations against this container before believing them.

services:
  mariadb:
    image: mariadb:10.5.12          # the same version as .github/workflows/test-with-mariadb.yml
    ports:
      - '127.0.0.1:3306:3306'
    environment:
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      # `live` is the database name, not a typo for the file name. sequelize/config.cjs has
      # exactly one MariaDB block, `live`, and it connects to a database called `live` as
      # root. .github/workflows/test-with-mariadb.yml creates the same name with NODE_ENV
      # set to live, so CI is what this has to agree with — a local container creating
      # `development` would have nothing for those migrations to run against.
      MYSQL_DATABASE: live
      MYSQL_ROOT_PASSWORD: password
    healthcheck:
      # `healthcheck.sh` is NOT in mariadb:10.5.12 -- the image gained it in a later
      # release. With it the container stays `unhealthy` forever and `./docker.sh start`,
      # which waits on health, fails every time even though the database is up and
      # serving. `mysqladmin ping` ships in 10.5.12 and answers `mysqld is alive`, so
      # health tracks the pinned image rather than a later one.
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-ppassword']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4
    profiles:
      - redis
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    profiles:
      - minio
    command: server /data --console-address ':9001'
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      MINIO_ROOT_USER: user
      MINIO_ROOT_PASSWORD: password

  elasticsearch:
    image: elasticsearch:8.15.0
    profiles:
      - elasticsearch
    ports:
      - '127.0.0.1:9200:9200'
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'

  kafka:
    image: bitnami/kafka:3.8
    profiles:
      - kafka
    ports:
      - '127.0.0.1:9092:9092'
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@127.0.0.1:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER

  qdrant:
    image: qdrant/qdrant:latest
    profiles:
      - qdrant
    ports:
      - '127.0.0.1:6333:6333'
